name: Deploy to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudpanel-production
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  CLOUDPANEL_HOST: ${{ vars.CLOUDPANEL_HOST || '13.127.64.109' }}
  DEPLOY_PATH: ${{ vars.CLOUDPANEL_DEPLOY_PATH || '/home/nxtutors/htdocs/www.nxtutors.com/public' }}

jobs:
  deploy:
    name: Build and deploy Laravel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required deployment secrets
        env:
          SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.CLOUDPANEL_SSH_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          if [ -z "${SSH_USER}" ] || [ -z "${SSH_PASSWORD}" ] || [ -z "${APP_KEY}" ]; then
            echo "Missing CLOUDPANEL_SSH_USER, CLOUDPANEL_SSH_PASSWORD, or APP_KEY GitHub secret."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare build environment
        run: |
          cp .env.example .env

      - name: Install PHP dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan key:generate --force

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Add CloudPanel host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${CLOUDPANEL_HOST}" >> ~/.ssh/known_hosts

      - name: Put site into maintenance mode
        env:
          SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.CLOUDPANEL_SSH_PASSWORD }}
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=yes "${SSH_USER}@${CLOUDPANEL_HOST}" "
            mkdir -p '${DEPLOY_PATH}'
            cd '${DEPLOY_PATH}'
            if [ -f artisan ]; then
              php artisan down --retry=60 || true
            fi
          "

      - name: Upload application files
        env:
          SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.CLOUDPANEL_SSH_PASSWORD }}
        run: |
          sshpass -p "${SSH_PASSWORD}" rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.cache/' \
            --exclude='node_modules/' \
            --exclude='127_0_0_1.sql' \
            --exclude='*.sql' \
            --exclude='*.sqlite' \
            --exclude='tests/' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='public/storage/*' \
            ./ "${SSH_USER}@${CLOUDPANEL_HOST}:${DEPLOY_PATH}/"

      - name: Create production environment file
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_URL: ${{ vars.APP_URL }}
          NXT_FACEBOOK: ${{ vars.NXT_FACEBOOK }}
          NXT_INSTAGRAM: ${{ vars.NXT_INSTAGRAM }}
          NXT_LINKEDIN: ${{ vars.NXT_LINKEDIN }}
          NXT_AI_FUNCTION_URL: ${{ secrets.NXT_AI_FUNCTION_URL }}
          APP_LOCALE: ${{ vars.APP_LOCALE }}
          APP_FALLBACK_LOCALE: ${{ vars.APP_FALLBACK_LOCALE }}
          APP_FAKER_LOCALE: ${{ vars.APP_FAKER_LOCALE }}
          APP_MAINTENANCE_DRIVER: ${{ vars.APP_MAINTENANCE_DRIVER }}
          BCRYPT_ROUNDS: ${{ vars.BCRYPT_ROUNDS }}
          LOG_CHANNEL: ${{ vars.LOG_CHANNEL }}
          LOG_STACK: ${{ vars.LOG_STACK }}
          LOG_DEPRECATIONS_CHANNEL: ${{ vars.LOG_DEPRECATIONS_CHANNEL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          DB_CONNECTION: ${{ vars.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE || vars.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD }}
          SESSION_DRIVER: ${{ vars.SESSION_DRIVER }}
          SESSION_LIFETIME: ${{ vars.SESSION_LIFETIME }}
          SESSION_ENCRYPT: ${{ vars.SESSION_ENCRYPT }}
          SESSION_PATH: ${{ vars.SESSION_PATH }}
          SESSION_DOMAIN: ${{ vars.SESSION_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          CASHFREE_ENV: ${{ vars.CASHFREE_ENV }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID || vars.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY || vars.CASHFREE_SECRET_KEY }}
          CASHFREE_API_VERSION: ${{ vars.CASHFREE_API_VERSION }}
          BROADCAST_CONNECTION: ${{ vars.BROADCAST_CONNECTION }}
          FILESYSTEM_DISK: ${{ vars.FILESYSTEM_DISK }}
          QUEUE_CONNECTION: ${{ vars.QUEUE_CONNECTION }}
          CACHE_STORE: ${{ vars.CACHE_STORE }}
          MEMCACHED_HOST: ${{ vars.MEMCACHED_HOST }}
          REDIS_CLIENT: ${{ vars.REDIS_CLIENT }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          MAIL_MAILER: ${{ vars.MAIL_MAILER }}
          MAIL_SCHEME: ${{ vars.MAIL_SCHEME }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: |
          umask 077
          write_env() {
            value="${!1}"
            if [ "${value}" = "__FILL_ME__" ]; then
              value=""
            fi
            printf '%s=%s\n' "$1" "${value}"
          }

          {
            write_env APP_NAME
            write_env APP_ENV
            write_env APP_KEY
            write_env APP_DEBUG
            write_env APP_URL
            write_env NXT_FACEBOOK
            write_env NXT_INSTAGRAM
            write_env NXT_LINKEDIN
            write_env NXT_AI_FUNCTION_URL
            write_env APP_LOCALE
            write_env APP_FALLBACK_LOCALE
            write_env APP_FAKER_LOCALE
            write_env APP_MAINTENANCE_DRIVER
            write_env BCRYPT_ROUNDS
            write_env LOG_CHANNEL
            write_env LOG_STACK
            write_env LOG_DEPRECATIONS_CHANNEL
            write_env LOG_LEVEL
            write_env DB_CONNECTION
            write_env DB_HOST
            write_env DB_PORT
            write_env DB_DATABASE
            write_env DB_USERNAME
            write_env DB_PASSWORD
            write_env SESSION_DRIVER
            write_env SESSION_LIFETIME
            write_env SESSION_ENCRYPT
            write_env SESSION_PATH
            write_env SESSION_DOMAIN
            write_env OPENAI_API_KEY
            write_env OPENAI_MODEL
            write_env OPENAI_IMAGE_MODEL
            write_env CASHFREE_ENV
            write_env CASHFREE_APP_ID
            write_env CASHFREE_SECRET_KEY
            write_env CASHFREE_API_VERSION
            write_env BROADCAST_CONNECTION
            write_env FILESYSTEM_DISK
            write_env QUEUE_CONNECTION
            write_env CACHE_STORE
            write_env MEMCACHED_HOST
            write_env REDIS_CLIENT
            write_env REDIS_HOST
            write_env REDIS_PASSWORD
            write_env REDIS_PORT
            write_env MAIL_MAILER
            write_env MAIL_SCHEME
            write_env MAIL_HOST
            write_env MAIL_PORT
            write_env MAIL_USERNAME
            write_env MAIL_PASSWORD
            write_env MAIL_FROM_ADDRESS
            write_env MAIL_FROM_NAME
            write_env VITE_APP_NAME
          } > .env.production

      - name: Upload production environment file
        env:
          SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.CLOUDPANEL_SSH_PASSWORD }}
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=yes "${SSH_USER}@${CLOUDPANEL_HOST}" "
            set -e
            cd '${DEPLOY_PATH}'
            umask 077
          "
          sshpass -p "${SSH_PASSWORD}" rsync -az --chmod=F600 .env.production "${SSH_USER}@${CLOUDPANEL_HOST}:${DEPLOY_PATH}/.env"

      - name: Finalize Laravel deployment
        env:
          SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.CLOUDPANEL_SSH_PASSWORD }}
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=yes "${SSH_USER}@${CLOUDPANEL_HOST}" "
            set -e
            cd '${DEPLOY_PATH}'
            trap 'php artisan up || true' EXIT

            if [ ! -f .env ]; then
              echo 'Missing production .env at ${DEPLOY_PATH}/.env'
              echo 'Check that the GitHub Actions variables/secrets are configured and the SSH user can write to the deploy path.'
              exit 1
            fi

            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache public/storage
            chmod -R ug+rw storage bootstrap/cache public/storage || true

            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:clear
            php artisan view:clear
            php artisan event:clear || true
            php artisan cache:clear || true
            php artisan config:cache
            php artisan view:cache
            php artisan queue:restart || true
          "
